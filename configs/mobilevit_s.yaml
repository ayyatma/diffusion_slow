model: mobilevit_s
num_classes: 10
input_size: 256

dataset:
  name: CIFAR10
  root: data
  download: true
  val_size: 5000
  split_seed: 0

thresholds:
  exit1: 0.70
  exit2: 0.80
  exit3: 0.85
  exit4: 0.88
  exit5: 0.90
  calibrate_from_val: true
  target_exit_rate: 0.20

exit_heads:
  lph_hidden_mult: 2
  lph_dropout: 0.10
  gah_hidden_dim: 256
  gah_dropout: 0.10

training:
  batch_size: 128
  num_workers: 4

  stage0:
    epochs: 10
    optimizer: AdamW
    lr: 1.0e-4
    weight_decay: 1.0e-4
    scheduler: CosineAnnealingLR
    t_max: 10
    checkpoint: models/mobilevit_s_cifar10_stage0.pt

  stage1:
    epochs: 40
    optimizer: AdamW
    lr: 5.0e-5
    weight_decay: 1.0e-4
    scheduler: CosineAnnealingLR
    t_max: 40
    exit_loss_weights: [0.4, 0.5, 0.6, 0.8, 0.9, 1.0]
    input_checkpoint: models/mobilevit_s_cifar10_stage0.pt
    checkpoint: models/mobilevit_s_cifar10_stage1_exp1.pt

  stage2:
    epochs: 30
    optimizer: AdamW
    lr: 1.0e-3
    weight_decay: 1.0e-4
    scheduler: CosineAnnealingLR
    t_max: 30
    kd_temperature: 4.0
    kd_alpha: 0.5
    exit_loss_weights: [1.0, 1.0, 0.8, 0.6, 0.4]
    input_checkpoint: models/mobilevit_s_cifar10_stage1_exp1.pt
    checkpoint: models/mobilevit_s_cifar10_stage2_exp1.pt

eval:
  checkpoint: models/mobilevit_s_cifar10_stage2_exp1.pt
